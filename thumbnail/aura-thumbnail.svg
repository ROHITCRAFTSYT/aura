<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Aura — YouTube thumbnail</title>
  <desc>Bold split-composition thumbnail: clay-on-ivory text overlay on the right, a clean app preview card on the left, Dawn palette.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf2e7"/>
      <stop offset="100%" stop-color="#f3e2cf"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d06a35"/>
      <stop offset="100%" stop-color="#bd5526"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="26" flood-color="#9a5a34" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#9a5a34" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Soft decorative sun arc, top-right -->
  <circle cx="1180" cy="-40" r="260" fill="#f6d9b8" opacity="0.45"/>
  <circle cx="1180" cy="-40" r="180" fill="#f3cba2" opacity="0.4"/>

  <!-- ───────────── LEFT: App preview card ───────────── -->
  <g filter="url(#lift)">
    <rect x="64" y="120" width="430" height="480" rx="26" fill="#fffaf3"/>
  </g>

  <!-- App header -->
  <rect x="64" y="120" width="430" height="62" rx="26" fill="#fffaf3"/>
  <rect x="64" y="150" width="430" height="32" fill="#fffaf3"/>
  <text x="92" y="160" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#a14e25" letter-spacing="2">aura</text>
  <circle cx="462" cy="151" r="13" fill="#f1e2d0"/>
  <text x="462" y="156" font-size="12" text-anchor="middle" fill="#a14e25">⚙</text>
  <line x1="64" y1="182" x2="494" y2="182" stroke="#efdfca" stroke-width="1.5"/>

  <!-- Hero copy -->
  <text x="279" y="232" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#52301c" text-anchor="middle">A gentle place to</text>
  <text x="279" y="262" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#52301c" text-anchor="middle">practice being yourself.</text>
  <text x="279" y="292" font-family="Verdana, sans-serif" font-size="12" fill="#9c7b56" text-anchor="middle">Calm AI tools for neurodiverse youth.</text>

  <!-- Three feature chips -->
  <g filter="url(#soft)">
    <rect x="96" y="324" width="120" height="120" rx="18" fill="#ffffff"/>
    <rect x="226" y="324" width="120" height="120" rx="18" fill="#ffffff"/>
    <rect x="356" y="324" width="106" height="120" rx="18" fill="#ffffff"/>
  </g>
  <text x="156" y="378" font-size="34" text-anchor="middle">💬</text>
  <text x="156" y="416" font-family="Verdana, sans-serif" font-size="13" font-weight="700" fill="#52301c" text-anchor="middle">Practice</text>
  <text x="286" y="378" font-size="34" text-anchor="middle">🔍</text>
  <text x="286" y="416" font-family="Verdana, sans-serif" font-size="13" font-weight="700" fill="#52301c" text-anchor="middle">Decode</text>
  <text x="409" y="378" font-size="34" text-anchor="middle">🌤</text>
  <text x="409" y="416" font-family="Verdana, sans-serif" font-size="12" font-weight="700" fill="#52301c" text-anchor="middle">Check-in</text>

  <!-- CTA -->
  <rect x="156" y="474" width="246" height="48" rx="24" fill="url(#brand)"/>
  <text x="279" y="504" font-family="Verdana, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Get started  →</text>

  <!-- Privacy line -->
  <text x="279" y="558" font-family="Verdana, sans-serif" font-size="11" fill="#9c7b56" text-anchor="middle">🔒 Private. No account. Nothing leaves your device.</text>

  <!-- ───────────── RIGHT: Bold text ───────────── -->

  <!-- Brand pill + hackathon tag -->
  <rect x="556" y="92" width="118" height="48" rx="24" fill="url(#brand)"/>
  <text x="615" y="124" font-family="Georgia, serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="3">AURA</text>
  <text x="690" y="116" font-family="Verdana, sans-serif" font-size="13" font-weight="700" fill="#a14e25" letter-spacing="1">YOUTH CODE × AI</text>
  <text x="690" y="135" font-family="Verdana, sans-serif" font-size="12" fill="#b08a64" letter-spacing="1">HACKATHON · 2026</text>

  <!-- Headline -->
  <text x="556" y="266" font-family="'Arial Black', Arial, sans-serif" font-size="78" font-weight="900" fill="#3f2210" letter-spacing="-2">I built an AI</text>
  <text x="556" y="338" font-family="'Arial Black', Arial, sans-serif" font-size="58" font-weight="900" fill="#bd5526" letter-spacing="-1.5">for autistic</text>
  <text x="556" y="404" font-family="'Arial Black', Arial, sans-serif" font-size="58" font-weight="900" fill="#bd5526" letter-spacing="-1.5">youth</text>

  <!-- "in 48 hours" accent -->
  <g transform="rotate(-7 1010 372)">
    <rect x="900" y="348" width="218" height="56" rx="28" fill="#fff3e4" stroke="#d06a35" stroke-width="3"/>
    <text x="1009" y="386" font-family="Georgia, serif" font-size="27" font-weight="800" fill="#bd5526" text-anchor="middle" font-style="italic">in 48 hours</text>
  </g>

  <!-- Divider -->
  <rect x="558" y="446" width="500" height="4" rx="2" fill="#d9a877"/>

  <!-- Value line -->
  <text x="558" y="506" font-family="Verdana, sans-serif" font-size="22" font-weight="700" fill="#52301c">Practice conversations · Decode messages</text>
  <text x="558" y="540" font-family="Verdana, sans-serif" font-size="22" font-weight="700" fill="#52301c">Calm daily check-ins</text>

  <!-- Bottom badge: cause -->
  <rect x="558" y="576" width="500" height="58" rx="16" fill="#f7e7d3"/>
  <text x="582" y="603" font-size="22">🧡</text>
  <text x="616" y="601" font-family="Verdana, sans-serif" font-size="14" font-weight="700" fill="#52301c">Built for the Akhil Autism Foundation</text>
  <text x="616" y="622" font-family="Verdana, sans-serif" font-size="12" fill="#9c7b56">aura-seven-livid.vercel.app</text>
</svg>
